name: Test YouTube note tools

on:
  pull_request:
    paths:
      - skills/yt-video-to-notes/**
      - .github/workflows/check-yt-video-to-notes.yml
  push:
    branches: [main]
    paths:
      - skills/yt-video-to-notes/**
      - .github/workflows/check-yt-video-to-notes.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/yt-video-to-notes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
