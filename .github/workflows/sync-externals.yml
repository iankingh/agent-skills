name: Sync external projects

on:
  schedule:
    # Mondays at 09:17 Asia/Taipei (01:17 UTC).
    - cron: '17 1 * * MON'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-external-projects
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install synchronization dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-sync.txt'
      - name: Test synchronization behavior
        run: python -B -m unittest discover -s tests -v
      - name: Update pinned submodule commits
        id: sync
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python -B scripts/sync_externals.py update --report "$RUNNER_TEMP/external-update.md"
      - name: Verify pinned submodules and generated README
        run: |
          python -B scripts/sync_externals.py check
          python -B scripts/sync_externals.py checkout
          python -B scripts/sync_externals.py check --checkout
          cat "$RUNNER_TEMP/external-update.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the source update PR
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BASE: ${{ steps.sync.outputs.base }}
          SYNC_BRANCH: codex/sync-external-skills
        run: |
          origin_git() {
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
          }
          base_ref="refs/heads/$BASE_BRANCH"
          sync_ref="refs/heads/$SYNC_BRANCH"
          remote_refs=$(origin_git ls-remote --heads origin "$base_ref" "$sync_ref")
          remote_base=$(awk -v ref="$base_ref" '$2 == ref {print $1}' <<< "$remote_refs")
          remote_sync=$(awk -v ref="$sync_ref" '$2 == ref {print $1}' <<< "$remote_refs")
          if [[ "$remote_base" != "$SYNC_BASE" ]]; then
            echo 'Default branch changed during synchronization. Rerun from the latest base.' >&2
            exit 1
          fi
          if [[ $(git rev-parse HEAD) == "$SYNC_BASE" ]]; then
            if [[ -n "$remote_sync" ]]; then
              origin_git push "--force-with-lease=$sync_ref:$remote_sync" origin ":$sync_ref"
            fi
            exit 0
          fi

          if [[ -z "$remote_sync" ]] || ! git cat-file -e "$remote_sync^{commit}" 2>/dev/null ||
             [[ $(git show -s --format='%T %P' HEAD) != $(git show -s --format='%T %P' "$remote_sync") ]]; then
            origin_git push "--force-with-lease=$sync_ref:$remote_sync" origin "HEAD:$sync_ref"
          fi
          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f head="$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH" -f base="$BASE_BRANCH" -f state=open \
            --jq '.[0].number // empty')
          title='chore(externals): 同步外部專案來源'
          report="$RUNNER_TEMP/external-update.md"
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
              --title "$title" --body-file "$report"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" \
              -f title="$title" -F body="@$report" --jq .html_url
          fi
