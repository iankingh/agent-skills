name: Sync external projects

on:
  schedule:
    # Monday 09:17 Asia/Taipei (01:17 UTC).
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-external-projects
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install synchronization dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-sync.txt'
      - name: Test synchronization behavior
        run: python -B -m unittest discover -s tests -v
      - name: Download upstream snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/sync_externals.py update --report "$RUNNER_TEMP/external-update.md"
      - name: Verify source snapshots and generated README
        run: python -B scripts/sync_externals.py check
      - name: Include all upstream files, including their tracked ignored files
        run: git add --force -- external/ externals.lock.json README.md
      - name: Create or update the source update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: codex/sync-external-skills
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          title: 'chore(externals): 同步外部專案來源'
          commit-message: 'chore(externals): 同步外部專案來源'
          body-path: ${{ runner.temp }}/external-update.md
          add-paths: |
            external/
            externals.lock.json
            README.md
