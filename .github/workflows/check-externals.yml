name: Check external snapshots

on:
  pull_request:
    paths:
      - externals.yaml
      - externals.lock.json
      - external/**
      - scripts/sync_externals.py
      - tests/**
      - requirements-sync.txt
      - README.md
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - externals.yaml
      - externals.lock.json
      - external/**
      - scripts/sync_externals.py
      - tests/**
      - requirements-sync.txt
      - README.md
      - .github/workflows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: 'python -m pip install --only-binary=:all: -r requirements-sync.txt'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/sync_externals.py check
